<h1>Wordt aan gewerkt. Open vanaf eind september</h1>

<script>
(function () {
  var input = document.getElementById("site-search-input");
  var button = document.getElementById("site-search-button");
  var results = document.getElementById("search-results");

  var steden = {
    "Amsterdam": "steden/amsterdam.html",
    "Rotterdam": "steden/rotterdam.html",
    "Utrecht": "steden/utrecht.html",
    "Weesp": "steden/weesp.html",
    "Maastricht": "steden/maastricht.html"
  };

  function normaliseer(tekst) {
    return (tekst || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function cafeUrl(link) {
    var hash = link.indexOf("#");
    if (hash === -1) return link;
    return link.substring(0, hash) + "?cafe=" + link.substring(hash + 1);
  }

  function toonResultaten(gevonden) {
    results.innerHTML = "";

    var unieke = [];
    var links = {};

    gevonden.forEach(function (item) {
      if (!links[item.href]) {
        links[item.href] = true;
        unieke.push(item);
      }
    });

    unieke.slice(0, 10).forEach(function (item) {
      var a = document.createElement("a");
      a.href = item.href;
      a.textContent = item.type === "stad"
        ? item.naam + " (stad)"
        : item.naam + " (" + item.stad + ")";
      results.appendChild(a);
    });

    if (!unieke.length) {
      results.textContent = "Geen resultaten gevonden";
    }

    results.style.display = "block";
  }

  function zoek() {
    var q = normaliseer(input.value.trim());
    results.innerHTML = "";

    if (!q) {
      results.style.display = "none";
      return;
    }

    var gevonden = [];

    Object.keys(steden).forEach(function (stad) {
      if (normaliseer(stad).indexOf(q) !== -1) {
        gevonden.push({
          naam: stad,
          type: "stad",
          stad: "",
          href: steden[stad]
        });
      }
    });

    /* Gebruik dezelfde centrale kroegenlijst als de kaartpagina. */
    fetch("kaart-bruine-kroegen.html")
      .then(function (response) {
        if (!response.ok) throw new Error("Kaartpagina niet gevonden");
        return response.text();
      })
      .then(function (html) {

        var start = html.indexOf("var kroegen = [");
        var einde = html.indexOf("];", start);

        if (start === -1 || einde === -1) {
          throw new Error("Kroegenlijst niet gevonden");
        }

        var lijst = html.substring(start, einde);

        var regex = /\{naam:"([^"]+)",stad:"([^"]+)",coords:\[([^\]]+)\],link:"([^"]+)"\}/g;
        var match;

        while ((match = regex.exec(lijst)) !== null) {
          var naam = match[1];
          var stad = match[2];

          if (
            normaliseer(naam).indexOf(q) !== -1 ||
            normaliseer(stad).indexOf(q) !== -1
          ) {
            gevonden.push({
              naam: naam,
              type: "café",
              stad: stad,
              href: cafeUrl(match[4])
            });
          }
        }

        toonResultaten(gevonden);
      })
      .catch(function () {
        toonResultaten(gevonden);
      });
  }

  input.addEventListener("input", zoek);
  button.addEventListener("click", zoek);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var eerste = results.querySelector("a");
      if (eerste) window.location.href = eerste.href;
    }
  });
})();
</script>

<script>
/* Dynamische aantallen cafés per stad.
   De aantallen worden rechtstreeks uit de stadspagina's gelezen.
   Daardoor veranderen ze automatisch wanneer een café wordt toegevoegd
   of verwijderd uit de betreffende stadspagina. */
(function () {
  var cityRows = document.querySelectorAll("[data-city-count]");

  var cityPages = {
    "Amsterdam": "steden/amsterdam.html",
    "Rotterdam": "steden/rotterdam.html",
    "Utrecht": "steden/utrecht.html",
    "Weesp": "steden/weesp.html"
  };

  function setCount(row, count) {
    row.textContent = count + " " + (count === 1 ? "café" : "cafés");
  }

  Array.prototype.forEach.call(cityRows, function (row) {
    var city = row.getAttribute("data-city-count");
    var page = cityPages[city];

    if (!page) return;

    fetch(page)
      .then(function (response) {
        if (!response.ok) throw new Error("Pagina niet gevonden");
        return response.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, "text/html");
        var count = doc.querySelectorAll(".cafe").length;
        setCount(row, count);
      })
      .catch(function () {
        /* Fallback: tel de cafés uit de zoeklijst als de stadspagina
           niet kan worden opgehaald. */
        var count = document.querySelectorAll(
          '.search-item[data-search-city="' + city.toLowerCase() + '"]'
        ).length;
        setCount(row, count);
      });
  });
})();
</script>
